# ============================================================
# Datei: config/database.yml
#
# Desc:
# Konfiguriert die Verbindung zwischen der Rails-Anwendung
# und dem PostgreSQL-Datenbankserver.
#
# Das PostgreSQL-Passwort wird nicht in dieser Datei gespeichert.
# Stattdessen liest Rails das Passwort aus der Umgebungsvariable
# POSTGRES_PASSWORD, die dotenv-rails beim Start aus der
# Datei .env lädt.
#
# Anwendungsfälle:
# - Sichere Verbindung zur PostgreSQL-Datenbank herstellen
# - Bestehende Entwicklungsdatenbank verwenden
# - Entwicklungs- und Testdatenbanken getrennt verwalten
# - Produktionsdatenbanken konfigurieren
# - Passwörter außerhalb des Quellcodes halten
# ============================================================


# ------------------------------------------------------------
# 1. Allgemeine Datenbankkonfiguration
#
# Diese Einstellungen werden von den nachfolgenden
# Datenbankumgebungen übernommen.
#
# Der Verbindungsadapter ist PostgreSQL.
#
# Die Zeichenkodierung Unicode ermöglicht die Verarbeitung
# internationaler Zeichen.
#
# Die Anzahl der Datenbankverbindungen wird über
# RAILS_MAX_THREADS gesteuert. Standardmäßig sind
# fünf Verbindungen vorgesehen.
# ------------------------------------------------------------

default: &default
  adapter: postgresql
  encoding: unicode

  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

  # ----------------------------------------------------------
  # 1.1 PostgreSQL-Server
  #
  # 127.0.0.1 bezeichnet den lokalen Computer.
  #
  # Port 5432 ist der Standardport von PostgreSQL.
  # ----------------------------------------------------------

  host: 127.0.0.1
  port: 5432

  # ----------------------------------------------------------
  # 1.2 Datenbankbenutzer
  #
  # Die lokale PostgreSQL-Installation verwendet
  # den Benutzer postgres.
  # ----------------------------------------------------------

  username: postgres

  # ----------------------------------------------------------
  # 1.3 Sichere Passwortverwaltung
  #
  # Das Passwort wird ausschließlich aus der
  # Umgebungsvariable POSTGRES_PASSWORD gelesen.
  #
  # dotenv-rails lädt diese Variable beim Start von Rails
  # aus der Datei .env im Projektordner. Die Datei .env
  # wird nicht versioniert (siehe .gitignore).
  #
  # Das Passwort selbst steht nicht im Quellcode.
  #
  # to_s.inspect setzt den Wert in Anführungszeichen. So bleibt das
  # Passwort auch dann Text, wenn es nur aus Ziffern besteht
  # oder YAML-Sonderzeichen wie : oder # enthält. Ohne
  # Anführungszeichen würde YAML ein reines Ziffernpasswort als
  # Zahl lesen, und PostgreSQL lehnt die Anmeldung ab.
  # ----------------------------------------------------------

  password: <%= ENV["POSTGRES_PASSWORD"].to_s.inspect %>

  # ----------------------------------------------------------
  # 1.4 Verschlüsselung der lokalen Verbindung
  #
  # Unter Windows versucht der PostgreSQL-Client (Gem pg)
  # zuerst eine GSSAPI- bzw. SSL-verschlüsselte Verbindung.
  # Der lokale Server bricht diesen Versuch ab; Rails meldet
  # dann "server closed the connection unexpectedly".
  #
  # Da Datenbank und Anwendung auf demselben Rechner laufen,
  # wird die Verbindung unverschlüsselt aufgebaut.
  # ----------------------------------------------------------

  gssencmode: disable
  sslmode: disable


# ------------------------------------------------------------
# 2. Entwicklungsumgebung
#
# Diese Umgebung wird beim lokalen Entwickeln verwendet.
#
# Die bereits vorhandene Entwicklungsdatenbank
# sciport_visualization_development bleibt bestehen.
#
# Die Datenbank wird durch diese Konfiguration
# weder gelöscht noch neu erstellt.
# ------------------------------------------------------------

development:
  <<: *default

  database: sciport_visualization_development


# ------------------------------------------------------------
# 3. Testumgebung
#
# Rails verwendet für automatisierte Tests
# eine separate PostgreSQL-Datenbank.
#
# Dadurch bleiben die Daten der Entwicklungsumgebung
# von Testoperationen getrennt.
# ------------------------------------------------------------

test:
  <<: *default

  database: sciport_visualization_test


# ------------------------------------------------------------
# 4. Produktionsumgebung
#
# Die Produktionsumgebung verwendet einen separaten
# Datenbankbenutzer und ein eigenes Passwort.
#
# Das Produktionspasswort wird ebenfalls über
# eine Umgebungsvariable bereitgestellt.
#
# Die bestehenden Datenbanknamen und Konfigurationen
# für Cache, Queue und Cable bleiben erhalten.
#
# Hinweis: Auf einem Produktionsserver mit eigener
# Datenbank-Infrastruktur kann sslmode dort wieder auf
# "require" gesetzt werden, falls der Server SSL anbietet.
# ------------------------------------------------------------

production:

  # ----------------------------------------------------------
  # 4.1 Hauptdatenbank
  #
  # Speichert die eigentlichen Anwendungsdaten
  # der Produktionsumgebung.
  # ----------------------------------------------------------

  primary: &primary_production
    <<: *default

    database: sciport_visualization_production

    username: sciport_visualization

    # to_s.inspect: Passwort immer als Text lesen (siehe 1.3).
    password: <%= ENV["SCIPORT_VISUALIZATION_DATABASE_PASSWORD"].to_s.inspect %>


  # ----------------------------------------------------------
  # 4.2 Cache-Datenbank
  #
  # Wird für die persistente Zwischenspeicherung
  # von Anwendungsdaten verwendet.
  # ----------------------------------------------------------

  cache:
    <<: *primary_production

    database: sciport_visualization_production_cache

    migrations_paths: db/cache_migrate


  # ----------------------------------------------------------
  # 4.3 Queue-Datenbank
  #
  # Wird für die Verwaltung von Hintergrundaufgaben
  # verwendet.
  # ----------------------------------------------------------

  queue:
    <<: *primary_production

    database: sciport_visualization_production_queue

    migrations_paths: db/queue_migrate


  # ----------------------------------------------------------
  # 4.4 Cable-Datenbank
  #
  # Wird für die Datenbankunterstützung
  # von Action Cable verwendet.
  # ----------------------------------------------------------

  cable:
    <<: *primary_production

    database: sciport_visualization_production_cable

    migrations_paths: db/cable_migrate